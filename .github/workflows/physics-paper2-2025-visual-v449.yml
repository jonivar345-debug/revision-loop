name: v449 AS Physics Paper 2 nine visual methods QA
on:
  pull_request:
    paths:
      - physics_as_paper2_guided_v430.json
      - physics-paper2-visuals-v449.js
      - physics-paper2-visuals-v447.js
      - app.js
      - index.html
      - sw.js
      - editorial/physics-paper2-2025-mcq-matrix-v448.json
      - editorial/physics-paper2-2025-visual-audit-v449.md
      - tests/physics-paper2-2025-visual-v449.cjs
      - tests/physics-paper2-coach-browser-v430.mjs
      - .github/workflows/physics-paper2-2025-visual-v449.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paper2-v449:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check code and all Paper 2 source regressions
        run: |
          node --check app.js
          node --check physics-paper2-visuals-v449.js
          node tests/physics-paper2-2025-visual-v449.cjs
          node tests/physics-paper2-2025-style-v448.cjs
          node tests/physics-paper2-visual-v447.cjs
          node tests/physics-paper2-coach-v430.cjs
          node tests/physics-paper2-spec-v443.cjs
          node tests/physics-paper2-past-style-v444.cjs
          node tests/physics-paper2-earlier-sources-v445.cjs
          node tests/physics-paper2-recent-sources-v446.cjs
          node tests/physics-paper2-mcq-2024-audit-v446.cjs
          node tests/mobile-cloud-progress-v428.cjs
          node tests/universal-study-actions-v432.cjs
          node tests/mock-unlimited-v438.cjs
          node tests/study-focus-v440.cjs
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.64.1
          npx playwright install --with-deps chromium
      - name: Browser - nine SVGs, 27 distractors, older cards, phone and desktop
        run: node tests/physics-paper2-coach-browser-v430.mjs
