name: Task 1 v391 19 original AQA Year 1 Pure worked mock questions
on:
  pull_request:
    paths:
      - 'app.js'
      - 'sw.js'
      - 'editorial/task1-v391-maths-19-original-year1-pure-working-review.json'
      - 'tests/task1-v391-maths-19-year1-pure-working-review.cjs'
      - '.github/workflows/task1-v391-maths-19-year1-pure-working-review.yml'
  workflow_dispatch:
jobs:
  original-year1-pure-working:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test 19 source-matched AQA Pure Maths questions and 132 manual method marks
        run: node tests/task1-v391-maths-19-year1-pure-working-review.cjs
      - name: Recheck Physics, Chemistry, Maths prior source guards and model answers
        run: node tests/task1-v390-physics-19-working-review.cjs && node tests/task1-v389-question-echo-no-credit.cjs && node tests/task1-v386-chemistry-25-working-review.cjs && node tests/task1-v383-maths-trig-differentiation-manual-review.cjs && node tests/task1-v382-maths-eighteen-worked-exam-manual-marking.cjs
