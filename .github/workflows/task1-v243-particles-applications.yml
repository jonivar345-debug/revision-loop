name: Task 1 v243 Physics particle application marking
on:
  pull_request:
    paths:
      - 'physics_particles_applications_v243.json'
      - 'tests/task1-v243-physics-particles-applications.cjs'
      - 'app.js'
      - 'sw.js'
      - '.github/workflows/task1-v243-particles-applications.yml'
  push:
    branches: [main]
jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/task1-v243-physics-particles-applications.cjs
