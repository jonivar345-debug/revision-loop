name: v443 AS Physics Paper 2 specification accuracy
on:
  pull_request:
    paths:
      - physics_as_paper2_guided_v430.json
      - app.js
      - index.html
      - sw.js
      - tests/physics-paper2-spec-v443.cjs
      - tests/physics-paper2-coach-v430.cjs
      - tests/physics-paper2-coach-browser-v430.mjs
      - .github/workflows/physics-paper2-spec-v443.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paper2:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source and history safety regressions
        run: |
          node --check app.js
          node tests/physics-paper2-spec-v443.cjs
          node tests/physics-paper2-coach-v430.cjs
          node tests/physics-mock-breadth-v439.cjs
          node tests/physics-mock-quality-v439.cjs
          node tests/mobile-cloud-progress-v428.cjs
          node tests/universal-study-actions-v432.cjs
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.64.1
          npx playwright install --with-deps chromium
      - name: Browser Paper 2 test on phone and desktop
        run: node tests/physics-paper2-coach-browser-v430.mjs
