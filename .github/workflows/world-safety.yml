name: World safety and media integration

on:
  push:
    branches: [automation/world-zoom-controls-20261021, fix/world-globe-improvements-20261024]
  pull_request:

jobs:
  world-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify complete world research and index
        run: |
          node tests/world-editorial-integrity.cjs
          node tests/world-destination-geography.cjs
          node tests/world-earth-geography.cjs
          node tests/world-offline-archive.cjs
          node scripts/rebuild-world-index.cjs --check
      - name: Verify historical purchase preservation and actual app migration
        run: |
          node tests/world-shop-id-preservation.cjs
          node tests/world-profile-preservation.cjs
          node tests/world-production-economy-integration.cjs
          node tests/world-streak-points-only-v94.cjs
          node tests/world-fair-shop-v95.cjs
      - name: Verify country explorer, globe bridge and photo licensing
        run: |
          node tests/world-globe-article-bridge.cjs
          node tests/world-photo-licence-audit.cjs
          node tests/world-commons-media.cjs
          node tests/world-location-photo-gallery.cjs
          node tests/world-photo-credits-dialog.cjs
          node tests/world-city-offline-guides.cjs
          node tests/world-photo-coverage-20261024.cjs
          node tests/world-featured-city-photos.cjs
          node tests/world-photo-bulk-coverage.cjs
          node tests/world-photo-v83-expansion.cjs
          node tests/world-photo-v84-remaining-coverage.cjs
          node tests/world-photo-national-reuse-v84.cjs
          node tests/world-photo-v85-depth.cjs
          node tests/world-photo-v86-focused.cjs
          node tests/world-photo-v87-last-mile.cjs
          node tests/world-photo-quality-v88.cjs
          node tests/world-photo-country-quality-v89.cjs
          node tests/world-photo-country-quality-v90.cjs
          node tests/world-photo-country-quality-v91.cjs
          node tests/world-v105-editorial.cjs
          node tests/world-v106-editorial.cjs
          node tests/world-v107-sources.cjs
          node tests/world-v107-archive.cjs
          node tests/world-v108-sources.cjs
          node tests/world-v108-local.cjs
          node tests/world-v108-catalogue.cjs
          node tests/world-v108-cover-crop.cjs
          node tests/world-v109-sources.cjs
          node tests/world-v109-archive.cjs
          node tests/world-v109-review.cjs
          node tests/world-v110-sources.cjs
          node tests/world-v110-archive.cjs
          node tests/world-v111-sources.cjs
          node tests/world-v111-archive.cjs
          node tests/world-v112-sources.cjs
          node tests/world-v112-archive.cjs
          node tests/world-v113-sources.cjs
          node tests/world-v113-archive.cjs
          node tests/world-v114-sources.cjs
          node tests/world-v114-archive.cjs
          node tests/world-v116-sources.cjs
          node tests/world-v116-archive.cjs
          node tests/world-v115-shop-cover-composition.cjs
          node -e "const a=require('./editorial/world-local-photo-audit-v114.json');const r=require('./editorial/reviews/world-local-photo-review-index.json');if(a.localPhotographs!==r.photoCount||a.fourPhotoLocalGalleries!==r.fullyLocal||r.destinations.some(d=>d.images.length!==4))throw Error('World v114 incomplete local archive')"
          node tests/world-v111-shop-cover.cjs
          node tests/world-photo-wave3-20261025.cjs
          node tests/world-photo-wave4-20261025.cjs
          node tests/world-photo-wave5-v97.cjs
          node tests/world-country-photos-v99.cjs
          node tests/world-photo-cover-fallback-v85.cjs
