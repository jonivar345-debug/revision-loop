name: Scanner marking regression

on:
  push:
    branches: [main]
  pull_request:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test photographed-working and model-answer marking
        run: |
          node tests/scanner-regression.cjs
          node tests/photo-review-regression.cjs
          node tests/vision-backend-regression.mjs
          node tests/vision-client-regression.cjs
          node tests/free-marking-regression.cjs
          node tests/historical-supplement-regression.cjs
          node tests/archive-regression.cjs
          node tests/question-alignment-regression.cjs
          node tests/paper-inventory-regression.cjs
          node tests/final-answer-policy.cjs
          node tests/gap-practice-regression.cjs
          node tests/adversarial-marking-regression.cjs
