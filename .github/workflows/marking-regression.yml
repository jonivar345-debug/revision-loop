name: Scanner marking regression

on:
  push:
    branches: [main, fix/world-globe-improvements-20261024]
  pull_request:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
