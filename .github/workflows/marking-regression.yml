name: Scanner marking regression

on:
  push:
    branches: [main]
  pull_request:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test photographed-working and model-answer marking
        run: |\n          node tests/scanner-regression.cjs\n          node tests/photo-review-regression.cjs
