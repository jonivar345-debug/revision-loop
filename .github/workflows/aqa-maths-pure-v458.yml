name: v458 2023 AQA Year 13 Pure Paper 1 methods and worked practice
on:
  pull_request:
    paths:
      - app.js
      - index.html
      - sw.js
      - maths_pure_2023_p1_v458.json
      - tests/aqa-maths-pure-2023-paper1-v458.cjs
      - tests/year13-pure-browser-v450.mjs
      - tests/aqa-maths-pure-2024-p2p3-v457.cjs
      - tests/aqa-maths-pure-2024-paper1-v452.cjs
      - .github/workflows/aqa-maths-pure-v458.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  maths-paper1-and-real-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source and regression test
        run: |
          node --check app.js
          node tests/aqa-maths-pure-2023-paper1-v458.cjs
          node tests/aqa-maths-pure-2024-p2p3-v457.cjs
          node tests/aqa-maths-pure-2024-paper1-v452.cjs
          node tests/aqa-maths-pure-archive-v451.cjs
          node tests/year13-pure-v450.cjs
          node tests/ui-refresh-v453.cjs
          node tests/shop-flow-v456.cjs
      - name: Install Chromium for responsive browser tests
        run: |
          npm install --no-save --no-package-lock playwright@1.64.1
          npx playwright install --with-deps chromium
      - name: Phone and desktop revision, archive and mock isolation
        run: node tests/year13-pure-browser-v450.mjs
      - name: Shop, theme and cloud regression
        run: |
          node tests/ui-refresh-browser-v453.mjs
          node tests/shop-flow-browser-v456.mjs
