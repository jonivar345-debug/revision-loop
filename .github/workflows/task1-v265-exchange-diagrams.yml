name: Task 1 v265 particle interaction sketch and manual scoring
on:
  pull_request:
    paths:
      - 'physics_particle_exchange_diagram_practice_v265.json'
      - 'tests/task1-v265-physics-exchange-diagrams.cjs'
      - 'app.js'
      - 'sw.js'
      - '.github/workflows/task1-v265-exchange-diagrams.yml'
  push:
    branches: [main]
jobs:
  physics-drawings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/task1-v264-exam-numeric-prefix-precision.cjs
      - run: node tests/task1-v265-physics-exchange-diagrams.cjs
