name: Task 1 v404 original exam non-answer guard
on:
  pull_request:
    paths:
      - 'app.js'
      - 'sw.js'
      - 'tests/task1-v404-exam-nonanswer-qa.cjs'
      - '.github/workflows/task1-v404-exam-nonanswer-qa.yml'
  workflow_dispatch:
jobs:
  exam-nonanswer-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          node --check app.js
          node --check tests/task1-v404-exam-nonanswer-qa.cjs
      - name: Check all 1,268 original exam non-answers and live mock boundary
        run: node tests/task1-v404-exam-nonanswer-qa.cjs
      - name: Confirm v403 and previous manual marking paths remain protected
        run: |
          node tests/task1-v403-original-82-manual-qa.cjs
          node tests/task1-v402-original-21-working-qa.cjs
          node tests/task1-v401-mock-signoff-inventory.cjs
          node tests/task1-v400-physics-8-method-qa.cjs
      - name: Flashcard denial and question-echo regression
        run: |
          node tests/task1-v392-denied-model-answer.cjs
          node tests/task1-v389-question-echo-no-credit.cjs
