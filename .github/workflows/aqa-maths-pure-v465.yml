name: v465 Year 13 Pure 2023 P2-P3 and 2022 P1 integrated QA
on:
  pull_request:
    paths:
      - app.js
      - index.html
      - sw.js
      - maths_pure_2023_p2_v459.json
      - maths_pure_2023_p3_v460.json
      - maths_pure_2022_p1_v461.json
      - tests/aqa-maths-pure-v465-integration.cjs
      - tests/year13-pure-browser-v450.mjs
      - .github/workflows/aqa-maths-pure-v465.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  maths-cross-paper-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact source, maths, science and progress regressions
        run: |
          node --check app.js
          node tests/aqa-maths-pure-v465-integration.cjs
          node tests/aqa-maths-pure-2022-paper1-v461.cjs
          node tests/aqa-maths-pure-2023-paper3-v460.cjs
          node tests/aqa-maths-pure-2023-paper2-v459.cjs
          node tests/aqa-maths-pure-2023-paper1-v458.cjs
          node tests/aqa-maths-pure-2024-p2p3-v457.cjs
          node tests/aqa-maths-pure-2024-paper1-v452.cjs
          node tests/aqa-maths-pure-archive-v451.cjs
          node tests/year13-pure-v450.cjs
          node tests/maths-must-memorise-v462.cjs
          node tests/flashcard-priority-v429.cjs
          node tests/task1-v161-maths-mock-question-scope.cjs
          node tests/task1-v301-school-mock-scope.cjs
          node tests/task1-v311-partial-skill-marking.cjs
          node tests/task1-v282-full-flashcard-answer-audit.cjs
          node tests/ui-refresh-v453.cjs
          node tests/shop-flow-v456.cjs
      - name: Install Chromium for phone and desktop
        run: |
          npm install --no-save --no-package-lock playwright@1.64.1
          npx playwright install --with-deps chromium
      - name: Browser Year 13 mock and archive, saved profile and memorisation
        run: node tests/year13-pure-browser-v450.mjs
      - name: Browser Shop, light/dark mode and cloud regressions
        run: |
          node tests/ui-refresh-browser-v453.mjs
          node tests/shop-flow-browser-v456.mjs
