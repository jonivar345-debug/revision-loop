name: Task 1 v293 concise flashcard marking and mock scope
on:
  pull_request:
    paths:
      - app.js
      - sw.js
      - mock_short_varied_recall_v293.json
      - tests/task1-v293-short-mock-recall-quality.cjs
      - .github/workflows/task1-v293-short-recall.yml
  push:
    branches: [main]
jobs:
  real-flashcard-marker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/task1-v293-short-mock-recall-quality.cjs
      - run: node tests/task1-v282-full-flashcard-answer-audit.cjs
      - run: node tests/task1-v283-strict-numeric-equivalence.cjs
