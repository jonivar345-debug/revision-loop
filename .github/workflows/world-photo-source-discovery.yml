name: Bulk World photo source audit (branch-only)

on:
  push:
    branches: [feature/world-photo-bulk-coverage-20261024]

permissions:
  contents: write

jobs:
  verify-and-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source-check place images from Wikipedia and Wikimedia Commons
        run: node scripts/discover-world-photos.mjs --limit=12 --write
      - name: Commit generated licence-checked photo candidates on this feature branch only
        run: |
          if git diff --quiet -- world-photo-discovery-data.js editorial/world-photo-discovery-report.json && test -f editorial/world-photo-discovery-report.json; then
            echo 'No source manifest changes'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add world-photo-discovery-data.js editorial/world-photo-discovery-report.json
          git commit -m "Generate source-reviewed Wiki/Commons destination photo candidates"
          git push origin HEAD:feature/world-photo-bulk-coverage-20261024
