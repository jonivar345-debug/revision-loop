name: Build World v111 quality-gated photos and full-archive review index

on:
  push:
    branches: [feature/world-v111-local-photos-cover-quality]
    paths:
      - '.github/workflows/world-local-photo-assets.yml'
      - 'editorial/world-local-photo-pilot.json'
      - 'scripts/build-local-world-photos.cjs'
      - 'scripts/optimize-world-photos.py'
      - 'scripts/extend-world-photo-manifest.cjs'
      - 'scripts/audit-local-world-photo-quality.py'
      - 'world-photo-editorial-v104.js'
      - 'tests/world-v105-editorial.cjs'
      - 'tests/world-v106-editorial.cjs'
      - 'editorial/world-v107-batch-targets.json'
      - 'editorial/world-v108-batch-targets.json'
      - 'scripts/build-world-v108-contact-sheet.py'
      - 'tests/world-v108-sources.cjs'
      - 'tests/world-v108-local.cjs'
      - 'editorial/world-v109-batch-targets.json'
      - 'editorial/world-v110-batch-targets.json'
      - 'editorial/world-v111-batch-targets.json'
      - 'editorial/world-v111-cover-priorities.json'
      - 'world-shop-cover-priorities.js'
      - 'world-location-photo-gallery.js'
      - 'tests/world-v111-sources.cjs'
      - 'tests/world-v111-archive.cjs'
      - 'tests/world-v111-shop-cover.cjs'
      - 'world-curated-photos.js'
      - 'scripts/build-world-v110-contact-sheet.py'
      - 'tests/world-v110-sources.cjs'
      - 'tests/world-v110-archive.cjs'
      - 'tests/world-local-photos.cjs'
      - 'scripts/build-world-v109-contact-sheet.py'
      - 'scripts/build-world-local-review-index.py'
      - 'tests/world-v109-sources.cjs'
      - 'tests/world-v109-archive.cjs'
      - 'tests/world-v109-review.cjs'
      - 'editorial/reviews/world-photo-review.html'
      - 'tests/world-v107-sources.cjs'
      - 'tests/world-v107-archive.cjs'
  workflow_dispatch:

# Prevent concurrent image-archive runs from racing to publish the same binary assets.
concurrency:
  group: world-photo-archive-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  archive-photos:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image codec
        run: python -m pip install Pillow==11.3.0
      - name: Select next batch from existing, source-checked destination catalogue
        run: node scripts/extend-world-photo-manifest.cjs
      - name: Verify seven curated v105 replacement sources
        run: node tests/world-v105-editorial.cjs
      - name: Verify geographically accurate v106 replacement sources
        run: node tests/world-v106-editorial.cjs
      - name: Check fixed gallery selections and cross-place photo exclusions
        run: node tests/world-v107-sources.cjs
      - name: Check 14 locked source selections and six corrected galleries
        run: node tests/world-v108-sources.cjs
      - name: Check 25 locked destination photo source lists
        run: node tests/world-v109-sources.cjs
      - name: Check 26 locked v110 source selections
        run: node tests/world-v110-sources.cjs
      - name: Check 30 locked v111 destination sources
        run: node tests/world-v111-sources.cjs
      - name: Fetch licence-checked Commons derivatives into local asset directory
        run: node scripts/build-local-world-photos.cjs
      - name: Convert first-party image assets to high-quality WebP
        run: python scripts/optimize-world-photos.py
      - name: Audit photo dimensions and near-duplicates
        run: python scripts/audit-local-world-photo-quality.py
      - name: Verify real WebP files and source attributions
        run: node tests/world-local-photos.cjs
      - name: Verify 20-place source shortlist against resulting local asset archive
        run: node tests/world-v107-archive.cjs
      - name: Validate actual 14-gallery files and six mandatory repairs
        run: node tests/world-v108-local.cjs
      - name: Generate real gallery and shop-cover crop contact sheet
        run: python scripts/build-world-v108-contact-sheet.py
      - name: Verify v109 imported files and older accepted locations
        run: node tests/world-v109-archive.cjs
      - name: Verify new v110 gallery files and historical v109 image preservation
        run: node tests/world-v110-archive.cjs
      - name: Verify v111 galleries preserve all existing v110 photographs
        run: node tests/world-v111-archive.cjs
      - name: Generate v111 full-frame and shop-card contact sheet
        run: |
          sed -e 's/v110/v111/g' -e 's/V110/V111/g' scripts/build-world-v110-contact-sheet.py > scripts/_world-v111-contact-sheet.py
          python scripts/_world-v111-contact-sheet.py
      - name: Create whole-archive local photo review index
        run: python scripts/build-world-local-review-index.py
      - name: Check all local photos are browseable in review page
        run: node tests/world-v109-review.cjs
      - name: Verify improved shop covers map to real local photos
        run: node tests/world-v111-shop-cover.cjs
      - name: Publish the generated files to this development branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/world world-local-photos.js editorial/world-local-photo-pilot.json editorial/world-local-photo-audit-v111.json editorial/world-v111-visual-review.json editorial/reviews/world-v111-cover-contact-sheet.jpg editorial/reviews/world-local-photo-review-index.json
          if git diff --cached --quiet; then
            echo 'Local photo files already up-to-date.'
          else
            git commit -m "Archive verified Commons World photographs as local assets"
            # Merge new edits to tests or workflows made while WebP conversion ran.
            # Never force-push; a true photo-file conflict fails this job safely.
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
