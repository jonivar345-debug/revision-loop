name: Task 1 v357 Physics and Chemistry first-mock core marker precision
on:
  pull_request:
    paths:
      - 'app.js'
      - 'sw.js'
      - 'editorial/task1-v357-science-mock-14-markers.json'
      - 'tests/task1-v357-science-mock-14-markers.cjs'
      - '.github/workflows/task1-v357-science-mock-14-markers.yml'
  workflow_dispatch:
jobs:
  science-mock-core-marker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax checks
        run: node --check app.js && node --check tests/task1-v357-science-mock-14-markers.cjs
      - name: Verify 14 existing mock cards' valid and invalid answers
        run: node tests/task1-v357-science-mock-14-markers.cjs
      - name: Preserve previous first mock and function-exclusion tests
        run: node tests/task1-v356-year1-functions-marking-probes.cjs && node tests/task1-v355-practical-calorimetry-marker-review.cjs && node tests/task1-v348-year1-pure-micro-recall.cjs
