name: Cloud sync, layout and flashcard v121 safety
on:
  pull_request:
    paths:
      - 'cloud-sync.js'
      - 'photoelectric-flashcard-marking.js'
      - 'deck.json'
      - 'cloud-sync-core.js'
      - 'layout-mode.js'
      - 'firestore.rules'
      - 'index.html'
      - 'app.js'
      - 'progress-backup.js'
      - 'sw.js'
      - 'tests/task1-deck-audit-v122.cjs'
      - 'tests/task1-practicals-v123.cjs'
      - 'tests/task1-gap-audit-v124.cjs'
      - 'tests/task1-precision-v125.cjs'
      - 'tests/chemistry-year1-chat-v126.cjs'
      - 'tests/task1-tests-definitions-v127.cjs'
      - 'tests/task1-practical-results-v128.cjs'
      - 'tests/task1-targeted-gaps-v129.cjs'
      - 'tests/task1-coverage-precision-v130.cjs'
      - 'tests/task1-fields-nuclear-inorganic-v131.cjs'
      - 'tests/task1-legacy-content-audit-v132.cjs'
      - 'tests/task1-practical-legacy-v133.cjs'
      - 'tests/task1-science-legacy-v134.cjs'
      - 'tests/task1-atomic-spec-v135.cjs'
      - 'tests/task1-exam-memory-v136.cjs'
      - 'tests/task1-syllabus-crosswalk-v137.cjs'
      - 'tests/task1-precision-memory-v138.cjs'
      - 'tests/task1-v139-verified-evidence.cjs'
      - 'editorial/task1-v139-verified-answer-evidence.json'
      - 'editorial/task1-v137-additional-syllabus-candidate-ledger.json'
      - 'editorial/task1-v136-curated-coverage.json'
      - 'editorial/task1-atomic-spec-first-pass-v135.json'
      - 'editorial/task1-legacy-card-content-audit-v134.json'
      - 'editorial/task1-legacy-card-content-audit-v133.json'
      - 'editorial/task1-required-practicals-ledger-v133.json'
      - 'editorial/task1-legacy-card-content-audit-v132.json'
      - 'tests/task1-short-answer-marking-v122.cjs'
      - 'tests/cloud-sync-v119.cjs'
      - 'tests/reset-layout-v120.cjs'
      - 'tests/cloud-photoelectric-v121.cjs'
      - '.github/workflows/cloud-sync-v119.yml'
  workflow_dispatch:
jobs:
  cloud-sync-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check cloud-sync-core.js
      - run: node --check layout-mode.js
      - run: node --check photoelectric-flashcard-marking.js
      - run: node --input-type=module --check < cloud-sync.js
      - run: node --check app.js
      - run: node --check progress-backup.js
      - run: node tests/task1-deck-audit-v122.cjs
      - run: node tests/task1-practicals-v123.cjs
      - run: node tests/task1-gap-audit-v124.cjs
      - run: node tests/task1-precision-v125.cjs
      - run: node tests/chemistry-year1-chat-v126.cjs
      - run: node tests/task1-tests-definitions-v127.cjs
      - run: node tests/task1-practical-results-v128.cjs
      - run: node tests/task1-targeted-gaps-v129.cjs
      - run: node tests/task1-coverage-precision-v130.cjs
      - run: node tests/task1-fields-nuclear-inorganic-v131.cjs
      - run: node tests/task1-legacy-content-audit-v132.cjs
      - run: node tests/task1-practical-legacy-v133.cjs
      - run: node tests/task1-science-legacy-v134.cjs
      - run: node tests/task1-atomic-spec-v135.cjs
      - run: node tests/task1-exam-memory-v136.cjs
      - run: node tests/task1-syllabus-crosswalk-v137.cjs
      - run: node tests/task1-precision-memory-v138.cjs
      - run: node tests/task1-v139-verified-evidence.cjs
      - run: node tests/task1-short-answer-marking-v122.cjs
      - run: node tests/cloud-sync-v119.cjs
      - run: node tests/reset-layout-v120.cjs
      - run: node tests/cloud-photoelectric-v121.cjs
      - run: node tests/revision-backup.cjs
      - run: node tests/world-profile-preservation.cjs
