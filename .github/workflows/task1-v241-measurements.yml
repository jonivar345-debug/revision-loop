name: Physics measurements v241 AQA evidence gate
on:
  pull_request:
    paths:
      - 'editorial/task1-v241-physics-measurements-crosswalk.json'
      - 'tests/task1-v241-physics-measurements-crosswalk.cjs'
      - '.github/workflows/task1-v241-measurements.yml'
  push:
    branches: [main]
jobs:
  verify-measurements:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/task1-v241-physics-measurements-crosswalk.cjs
