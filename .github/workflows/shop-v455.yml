name: v455 Shop and collection user experience QA
on:
  pull_request:
    paths:
      - index.html
      - ui-refresh-v453.js
      - shop-refresh-v455.css
      - sw.js
      - tests/shop-v455.cjs
      - tests/shop-browser-v455.mjs
      - .github/workflows/shop-v455.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collection-ui-and-revision-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preserve original progress and test categories, dark theme and data IDs
        run: |
          node --check ui-refresh-v453.js
          node --check app.js
          node tests/shop-v455.cjs
          node tests/ui-refresh-v453.cjs
          node tests/year13-pure-v450.cjs
          node tests/aqa-maths-pure-2024-paper1-v452.cjs
          node tests/physics-paper2-2025-visual-v449.cjs
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.64.1
          npx playwright install --with-deps chromium
      - name: Test Shop Characters, Outfits and Places on phone and desktop
        run: node tests/shop-browser-v455.mjs
      - name: Recheck the navigation, flashcards and Year 13 mock
        run: |
          node tests/ui-refresh-browser-v453.mjs
          node tests/year13-pure-browser-v450.mjs
