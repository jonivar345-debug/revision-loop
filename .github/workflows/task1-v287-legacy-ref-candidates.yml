name: Task 1 v287 legacy AS science specRef candidate audit
on:
  pull_request:
    paths:
      - 'tests/task1-v287-legacy-ref-candidates.cjs'
      - '.github/workflows/task1-v287-legacy-ref-candidates.yml'
  push:
    branches: [main]
jobs:
  inspect-cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/task1-v287-legacy-ref-candidates.cjs
