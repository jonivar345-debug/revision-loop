name: Task 1 v397 Year 1 Pure inverse/composite question exclusion
on:
  pull_request:
    paths:
      - 'app.js'
      - 'sw.js'
      - 'editorial/task1-v397-maths-first-pure-functions-qa.json'
      - 'tests/task1-v397-maths-first-pure-functions-qa.cjs'
      - '.github/workflows/task1-v397-maths-first-pure-functions-qa.yml'
  workflow_dispatch:
jobs:
  first-pure-question-exclusions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify 11 original function questions and retained Year 1 Pure topics
        run: node tests/task1-v397-maths-first-pure-functions-qa.cjs
      - name: Recheck mock scope and existing method-mark guards
        run: node tests/task1-v284-year1-pure-mock-boundary-audit.cjs && node tests/task1-v396-physics-18-working-qa.cjs
