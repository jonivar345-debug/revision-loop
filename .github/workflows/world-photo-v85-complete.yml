name: One-time v85 four-photo curation, source verification, and delivery audit
on:
  push:
    branches: [feature/four-photo-galleries-v85]
    paths: ['.github/workflows/world-photo-v85-complete.yml']
permissions:
  contents: write
concurrency:
  group: one-time-world-v85-photo-quality
  cancel-in-progress: true
jobs:
  source-and-delivery:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax first
        run: |
          node --check scripts/enrich-hard-world-photos-v85.mjs
          node --check scripts/prune-world-photo-enrichment-v85.cjs
          node --check world-location-photo-gallery.js
          node --check tests/world-photo-v85-depth.cjs
      - name: Remove known unrelated licensed files and log every rejected image
        run: node scripts/prune-world-photo-enrichment-v85.cjs
      - name: Source-check geographical landmarks and sea photographs for unfinished galleries
        run: node scripts/enrich-hard-world-photos-v85.mjs --write
      - name: Recompute exact four-photo coverage
        run: node scripts/audit-world-photo-depth.cjs --save
      - name: Sample 30 actual Commons image bytes and delivery failures
        run: node scripts/audit-world-photo-delivery-v85.mjs --write
        continue-on-error: true
      - name: Save reproducible photo research audit on feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add world-photo-enrichment-v85.js editorial/world-photo-enrichment-exclusions-v85.json editorial/world-photo-hard-location-v85.json editorial/world-photo-four-depth-v85.json
          test ! -f editorial/world-photo-live-delivery-v85.json || git add editorial/world-photo-live-delivery-v85.json
          git diff --staged --quiet && exit 0
          git commit -m 'Finalize v85 photo-source exclusions, harder places, and delivery audit'
          git fetch origin feature/four-photo-galleries-v85
          git rebase origin/feature/four-photo-galleries-v85
          git push origin HEAD:feature/four-photo-galleries-v85
