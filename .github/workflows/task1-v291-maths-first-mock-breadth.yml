name: Task 1 v291 Year 1 Pure Maths first mock breadth audit
on:
  pull_request:
    paths:
      - tests/task1-v291-maths-first-mock-breadth.cjs
      - .github/workflows/task1-v291-maths-first-mock-breadth.yml
  push:
    branches: [main]
jobs:
  first-pure-breadth-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/task1-v284-year1-pure-mock-boundary-audit.cjs
      - run: node tests/task1-v291-maths-first-mock-breadth.cjs
