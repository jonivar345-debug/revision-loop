name: Final one-time World Commons recovery v84
on:
  push:
    branches: [feature/remaining-world-commons-photo-sources-v84]
    paths: ['.github/workflows/world-photo-v84-finalize.yml']
permissions:
  contents: write
  actions: write
concurrency:
  group: world-photo-v84-final-recovery
  cancel-in-progress: true
jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Stop superseded duplicate Commons source audits
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for id in $(gh api "repos/$GITHUB_REPOSITORY/actions/runs?branch=feature%2Fremaining-world-commons-photo-sources-v84&per_page=100" --jq '.workflow_runs[] | select(.name == "One-off remaining destination Commons photo audit v84" and .status != "completed") | .id'); do
            echo "Cancel superseded source scan $id"
            gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$id/cancel" || true
          done
      - name: Scan exact Commons files and source licensing for remaining destinations
        run: node scripts/recover-remaining-world-photos.mjs --write
      - name: Save generated Commons photo records after syncing with new branch commits
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add world-photo-discovery-data.js editorial/world-photo-recovery-v84.json
          git diff --staged --quiet && exit 0
          git commit -m 'Save one-time Commons CC source recovery for remaining destinations'
          git fetch origin feature/remaining-world-commons-photo-sources-v84
          git rebase origin/feature/remaining-world-commons-photo-sources-v84
          git push origin HEAD:feature/remaining-world-commons-photo-sources-v84
