name: Task 1 v354 first-mock Maths functions and Chemistry cracking pressure
on:
  pull_request:
    paths:
      - 'app.js'
      - 'sw.js'
      - 'chemistry_cracking_pressure_recall_v354.json'
      - 'editorial/task1-v354-maths-functions-cracking-gap.json'
      - 'tests/task1-v354-maths-functions-cracking.cjs'
      - '.github/workflows/task1-v354-maths-functions-cracking.yml'
  workflow_dispatch:
jobs:
  functions-cracking-short-card-marking:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: node --check app.js && node --check tests/task1-v354-maths-functions-cracking.cjs
      - name: Test genuine spec gap and Maths function marker against production evaluator
        run: node tests/task1-v354-maths-functions-cracking.cjs
      - name: Preserve previous mock card and marking tests
        run: node tests/task1-v353-science-core-marker-review.cjs && node tests/task1-v352-mixed-science-core-precision.cjs && node tests/task1-v348-year1-pure-micro-recall.cjs && node tests/task1-v347-equation-balance-precision.cjs
