name: Task 1 v240 Energetics specification evidence
on:
  pull_request:
    paths:
      - 'editorial/task1-v240-chemistry-energetics-crosswalk.json'
      - 'tests/task1-v240-chemistry-energetics-crosswalk.cjs'
      - '.github/workflows/task1-v240-energetics.yml'
  push:
    branches: [main]
jobs:
  energetic-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/task1-v240-chemistry-energetics-crosswalk.cjs
