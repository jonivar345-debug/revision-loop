name: Task 1 v418 combined school-mock marking and AQA references
on:
  pull_request:
    paths:
      - 'app.js'
      - 'sw.js'
      - 'maths_pure_proof_vectors_v190.json'
      - 'maths_pure_proof_vector_applications_v209.json'
      - 'maths_year1_pure_targeted_practice_v340.json'
      - 'chemistry_mock_precision_v199.json'
      - 'tests/task1-v411-supplement-mock-routing-audit.cjs'
      - 'tests/task1-v412-supplement-multimark-manual.cjs'
      - 'tests/task1-v414-maths-mock-spec-metadata.cjs'
      - 'tests/task1-v415-chem-arrhenius-spec.cjs'
      - '.github/workflows/task1-v418-release-regressions.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check application, cache and test syntax
        run: |
          node --check app.js
          node --check sw.js
          node --check tests/task1-v411-supplement-mock-routing-audit.cjs
          node --check tests/task1-v412-supplement-multimark-manual.cjs
          node --check tests/task1-v414-maths-mock-spec-metadata.cjs
          node --check tests/task1-v415-chem-arrhenius-spec.cjs
      - name: Verify v412 supplementary mock manual-marking safety
        run: |
          node tests/task1-v412-supplement-multimark-manual.cjs
          node tests/task1-v411-supplement-mock-routing-audit.cjs
      - name: Verify v414 and v415 spec metadata and source hashes
        run: |
          node tests/task1-v414-maths-mock-spec-metadata.cjs
          node tests/task1-v415-chem-arrhenius-spec.cjs
      - name: Regress prior school-mock content boundaries and marking
        run: |
          node tests/task1-v410-live-mock-marker-route.cjs
          node tests/task1-v409-short-negation-qa.cjs
          node tests/task1-v408-chemistry-mock-boundary-qa.cjs
          node tests/task1-v407-electricity-manual-practice.cjs
          node tests/task1-v406-explicit-markpoint-denials.cjs
          node tests/task1-v405-short-semantic-qa.cjs
          node tests/task1-v404-exam-nonanswer-qa.cjs
          node tests/task1-v403-original-82-manual-qa.cjs
          node tests/task1-v401-mock-signoff-inventory.cjs
