name: Task 1 v249 Chemistry rate and Kp mock marking
on:
  pull_request:
    paths:
      - 'chemistry_rates_kp_applications_v249.json'
      - 'tests/task1-v249-chemistry-rates-kp-applications.cjs'
      - 'tests/task1-v248-physics-measurements-applications.cjs'
      - 'app.js'
      - 'sw.js'
      - '.github/workflows/task1-v249-chemistry-rates-kp.yml'
  push:
    branches: [main]
jobs:
  rates-kp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/task1-v245-maths-pure-applied.cjs
      - run: node tests/task1-v246-maths-circle-geometry.cjs
      - run: node tests/task1-v247-chemistry-energetics-applications.cjs
      - run: node tests/task1-v248-physics-measurements-applications.cjs
      - run: node tests/task1-v249-chemistry-rates-kp-applications.cjs
