name: Task 1 v402 original three-subject method and mechanism safeguards
on:
  pull_request:
    paths:
      - 'app.js'
      - 'sw.js'
      - 'editorial/task1-v402-original-21-working-qa.json'
      - 'tests/task1-v402-original-21-working-qa.cjs'
      - '.github/workflows/task1-v402-original-21-working-qa.yml'
  workflow_dispatch:
jobs:
  original-twenty-one-manual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify 21 original first-mock questions and manual markers
        run: node tests/task1-v402-original-21-working-qa.cjs
      - name: Preserve v401-v396 content and marking invariants
        run: |
          node tests/task1-v401-mock-signoff-inventory.cjs
          node tests/task1-v400-physics-8-method-qa.cjs
          node tests/task1-v399-maths-15-working-qa.cjs
          node tests/task1-v398-chemistry-24-working-qa.cjs
          node tests/task1-v397-maths-first-pure-functions-qa.cjs
          node tests/task1-v396-physics-18-working-qa.cjs
