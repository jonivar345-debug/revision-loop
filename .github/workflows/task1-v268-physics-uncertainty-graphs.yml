name: Task 1 v268 AS Physics uncertainty graph and recall verification
on:
  pull_request:
    paths:
      - 'physics_uncertainty_graph_practice_v268.json'
      - 'physics_uncertainty_graph_recall_v268.json'
      - 'tests/task1-v268-physics-uncertainty-graphs.cjs'
      - 'tests/task1-v260-maths-year1-pure-breadth.cjs'
      - 'tests/task1-v267-chemistry-structure-diagrams.cjs'
      - 'app.js'
      - 'sw.js'
      - '.github/workflows/task1-v268-physics-uncertainty-graphs.yml'
  push:
    branches: [main]
jobs:
  physics-uncertainty-graphs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/task1-v268-physics-uncertainty-graphs.cjs
      - run: node tests/task1-v260-maths-year1-pure-breadth.cjs
      - run: node tests/task1-v267-chemistry-structure-diagrams.cjs
