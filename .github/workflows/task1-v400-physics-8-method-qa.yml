name: Task 1 v400 Physics Waves and Electricity 8 original method safeguards
on:
  pull_request:
    paths:
      - 'app.js'
      - 'sw.js'
      - 'editorial/task1-v400-physics-8-method-qa.json'
      - 'tests/task1-v400-physics-8-method-qa.cjs'
      - '.github/workflows/task1-v400-physics-8-method-qa.yml'
  workflow_dispatch:
jobs:
  physics-eight-manual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify eight original Physics method and practical questions
        run: node tests/task1-v400-physics-8-method-qa.cjs
      - name: Ensure previous Chemistry Maths and Physics safeguards remain
        run: node tests/task1-v399-maths-15-working-qa.cjs && node tests/task1-v398-chemistry-24-working-qa.cjs && node tests/task1-v397-maths-first-pure-functions-qa.cjs && node tests/task1-v396-physics-18-working-qa.cjs
