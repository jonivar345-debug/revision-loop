name: One-off remaining destination Commons photo audit v84

on:
  push:
    branches: [feature/remaining-world-commons-photo-sources-v84]

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Gather 114 missing destination photos with current Commons licence checks
        run: node scripts/recover-remaining-world-photos.mjs --write
      - name: Write sourced results to this feature branch only
        if: always()
        run: |
          if ! test -f editorial/world-photo-recovery-v84.json; then
            echo 'No successfully generated photo audit file'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add world-photo-discovery-data.js editorial/world-photo-recovery-v84.json
          git diff --staged --quiet && exit 0
          git commit -m 'Add current Commons CC photo candidates for uncovered destinations'
          git push origin HEAD:feature/remaining-world-commons-photo-sources-v84
