name: Task 1 v250 Physics electricity application marking
on:
  pull_request:
    paths:
      - 'physics_electricity_applications_v250.json'
      - 'tests/task1-v250-physics-electricity-applications.cjs'
      - 'tests/task1-v249-chemistry-rates-kp-applications.cjs'
      - 'app.js'
      - 'sw.js'
      - '.github/workflows/task1-v250-physics-electricity.yml'
  push:
    branches: [main]
jobs:
  electricity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/task1-v249-chemistry-rates-kp-applications.cjs
      - run: node tests/task1-v250-physics-electricity-applications.cjs
