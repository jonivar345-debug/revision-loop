name: v452 AQA June 2024 Paper 1 primary-source Pure methods QA
on:
  pull_request:
    paths:
      - maths_pure_2024_p1_v452.json
      - app.js
      - index.html
      - sw.js
      - tests/aqa-maths-pure-2024-paper1-v452.cjs
      - tests/year13-pure-browser-v450.mjs
      - .github/workflows/aqa-maths-pure-2024-v452.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  maths-pure-2024-paper1:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Original paper index, worked maths and mock-scope regression
        run: |
          node --check app.js
          node tests/aqa-maths-pure-2024-paper1-v452.cjs
          node tests/aqa-maths-pure-archive-v451.cjs
          node tests/year13-pure-v450.cjs
          node tests/physics-paper2-2025-visual-v449.cjs
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.64.1
          npx playwright install --with-deps chromium
      - name: Phone and desktop browser mock, paper archive, optional exclusions and progress
        run: node tests/year13-pure-browser-v450.mjs
