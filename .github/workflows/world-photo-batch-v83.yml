name: Source-check missing World destination photographs (one-time batch)
on:
  push:
    branches: [feature/world-photo-batched-coverage-v83]
permissions:
  contents: write
jobs:
  source-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Batch-source Commons image records, obeying Wikimedia Retry-After and author restrictions
        run: node scripts/discover-world-photos-batched.mjs --limit=211 --write
      - name: Store generated, licence-checked source records on feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add world-photo-discovery-data.js editorial/world-photo-batch-audit-v83.json
          git diff --staged --quiet && exit 0
          git commit -m 'Record batch-checked Commons CC destination photographs'
          git push origin HEAD:feature/world-photo-batched-coverage-v83
