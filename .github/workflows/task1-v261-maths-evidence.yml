name: Task 1 v261 Maths first mock seven evidence gaps
on:
  pull_request:
    paths:
      - 'editorial/task1-v261-maths-seven-gap-evidence.json'
      - 'tests/task1-v261-maths-seven-gap-evidence.cjs'
      - '.github/workflows/task1-v261-maths-evidence.yml'
  push:
    branches: [main]
jobs:
  gap-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/task1-v260-maths-year1-pure-breadth.cjs
      - run: node tests/task1-v261-maths-seven-gap-evidence.cjs
